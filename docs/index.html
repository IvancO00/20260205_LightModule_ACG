<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIN Light Controller</title>

    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .status {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #ddd;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .status.connected {
            background-color: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .control-group {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            font-weight: 600;
        }

        button:active {
            opacity: 0.7;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-connect {
            background-color: #007bff;
            color: white;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .btn-red { background-color: #ff3b30; color: white; }
        .btn-green { background-color: #34c759; color: white; }
        .btn-blue { background-color: #007aff; color: white; }
        .btn-white { background-color: #ffffff; color: black; }
        .btn-off { background-color: #8e8e93; color: white; }

        input[type="text"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .log {
            font-family: monospace;
            font-size: 12px;
            color: #666;
            width: 100%;
            max-width: 400px;
            height: 100px;
            overflow-y: auto;
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .version-label {
            position: absolute; /* Fondamentale: permette di posizionarlo dove vuoi */
            top: 20px;          /* Distanza dall'alto */
            right: 20px;        /* Distanza da destra */
            font-size: 12px;    /* Testo piccolino */
            color: #999;        /* Grigio chiaro discreto */
            font-family: monospace; /* Un tocco "tecnico" */
        }
    </style>
</head>
<body>
    <!-- Versione della pagina -->
    <div class="version-label">ACG Light v1.1</div>

    <!-- Logo centrato in alto -->
    <div style="text-align: center;">
    <img src="img/logo.png" alt="Logo ACG" style="width: 100px; border-radius: 10px;">
    </div>

    <h1>LIN Light Controller</h1> <!-- Titolo principale -->

    <div id="status" class="status disconnected">Disconnected</div>

    <button id="connectBtn" class="btn-connect">Connect to ESP32</button>

    <!-- Quick control buttons for common commands -->
    <div class="control-group">
        <h3>Quick Controls</h3>
        <button class="btn-red" onclick="sendCommand('L,99,4095,0,0')">ALL RED</button>
        <button class="btn-green" onclick="sendCommand('L,99,0,4095,0')">ALL GREEN</button>
        <button class="btn-blue" onclick="sendCommand('L,99,0,0,4095')">ALL BLUE</button>
        <button class="btn-white" onclick="sendCommand('L,99,4095,4095,4095')">ALL WHITE</button>
        
        <!--Invia il segnale "CLEAR" per spegnere e resetta gli slider a 0 -->
        <button class="btn-off" onclick="resetSlidersAndOff()">ALL OFF</button> 
    </div>

    <!-- Sliders for brightness control -->
     <div class="control-group">
        <h3>Mixer RGB</h3>
        <!-- Range da 0 a 4095. onchange = aggiorna quando rilasci (più sicuro per il Bluetooth) -->
        <label>Red (0-4095)</label>
        <input type="range" id="SliderR" min="0" max="4095" value="0" onchange="updateRGB()">

        <label>Green (0-4095)</label>
        <input type="range" id="SliderG" min="0" max="4095" value="0" onchange="updateRGB()">

        <label>Blue (0-4095)</label>
        <input type="range" id="SliderB" min="0" max="4095" value="0" onchange="updateRGB()">
    </div>


<!-- Custom command input -->
    <div class="control-group">
        <h3>Custom Command</h3>
        <input type="text" id="customCmd" placeholder="e.g., L,1,4095,0,0">
        <button style="background-color: #5856d6; color: white;" onclick="sendCustom()">Send</button>
    </div>

    <div id="log" class="log"></div>

    <!-- NUOVA AREA DEBUG -->
    <h3>Debug Console</h3>
    <div id="debugConsole" class="log" style="background-color: #000; color: #0f0; font-family: monospace; height: 150px;"></div>










    <script>
        // Nordic UART Service (NUS) UUIDs
        const serviceUuid = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const characteristicUuidRx = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // RX on ESP32 (Write) for phone to send
        const characteristicUuidTx = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // TX on ESP32 (Notify)

        let bluetoothDevice;
        let rxCharacteristic; // This is the one we write TO
        let txCharacteristic; // This is the one we receive FROM

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        function log(message) {
            const entry = document.createElement('div');
            entry.textContent = `> ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            try {
                log('Requesting Bluetooth Device...');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "ESP32" }], // Looks for "ESP32_LIN_Control_Ivan"
                    optionalServices: [serviceUuid]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                log('Connecting to GATT Server...');
                const server = await bluetoothDevice.gatt.connect();

                log('Getting Service...');
                const service = await server.getPrimaryService(serviceUuid);

                log('Getting Characteristics...');
                rxCharacteristic = await service.getCharacteristic(characteristicUuidRx); // We write to this
                // txCharacteristic = await service.getCharacteristic(characteristicUuidTx); // Optional: Read from ESP32

                statusDiv.textContent = 'Connected';
                statusDiv.className = 'status connected';
                connectBtn.disabled = true;
                connectBtn.textContent = "Connected";
                
                log('Ready to send commands!');

            } catch (error) {
                log('Argh! ' + error);
            }
        });

        function onDisconnected(event) {
            statusDiv.textContent = 'Disconnected';
            statusDiv.className = 'status disconnected';
            connectBtn.disabled = false;
            connectBtn.textContent = "Connect to ESP32";
            log('Device disconnected.');
        }

        async function sendCommand(cmd) {
            if (!rxCharacteristic) {
                log('Not connected!');
                return;
            }

            try {
                // Ensure data ends with newline \n
                let commandToSend = cmd.endsWith('\n') ? cmd : cmd + '\n';
                let encoder = new TextEncoder();
                let data = encoder.encode(commandToSend);

                await rxCharacteristic.writeValue(data);
                log(`Sent: ${cmd}`);
            } catch (error) {
                log('Send failed: ' + error);
            }
        }

        /* 
           Questa funzione viene chiamata ogni volta che muovi UNO QUALSIASI degli slider.
           Legge TUTTI e tre i valori attuali e invia un unico comando combinato.
        */
        function updateRGB() {
            printDebug("Aggiornamento RGB in corso..."); // Scrive nella console nera ogni volta che viene chiamata
            // 1. Recupera i valori attuali dai tre slider HTML usando i loro ID
            let r = document.getElementById('SliderR').value;
            let g = document.getElementById('SliderG').value;
            let b = document.getElementById('SliderB').value;
        
            // 2. Costruisci il comando LIN composto
            // Esempio risultato: "L,99,4095,2000,0" (Rosso max, Verde medio, Blu spento)
            let comandoComposto = `L,99,${r},${g},${b}`;
        
            // 3. Invia tramite Bluetooth
            // window.log è la funzione che scrive nel riquadro bianco in basso
            if(window.log) window.log(`Mixer RGB: R=${r} G=${g} B=${b}`); 

            printDebug(`Comando RGB composto: ${comandoComposto}`); // Scrive nella console nera
            sendCommand(comandoComposto);
        }

        /*
        Quando viene premuto ALL OFF, viene chiamata questa funziona che resetta gli slider a 0
        */
       function resetSlidersAndOff() {
        // porta visivamente gli slider a 0
        document.getElementById('SliderR').value = 0;
        document.getElementById('SliderG').value = 0;
        document.getElementById('SliderB').value = 0;

        // Invia anche il comando di spegnimento
        updateRGB(); // Questo invierà "L,99,0,0,0" che è l'equivalente di ALL OFF
       }

       /*
        Function to send custom command from a text input field.
       */
        function sendCustom() {
            const cmd = document.getElementById('customCmd').value;
            if (cmd) sendCommand(cmd);
        }

        // Funzione per scrivere nella nuova console nera
        function printDebug(msg) {
            var dbg = document.getElementById('debugConsole');
            var time = new Date().toLocaleTimeString();
            // Aggiunge la riga in cima (così vedi sempre l'ultima)
            dbg.innerHTML = `[${time}] ${msg}<br>` + dbg.innerHTML;
        }
    </script>
</body>
</html>
